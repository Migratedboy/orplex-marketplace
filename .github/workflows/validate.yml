name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm install` on purpose: the validator is dependency-free, so a
      # supply-chain problem in a dev dependency can never weaken the gate.
      - name: Validate catalog (schema, signature, digests, no executables)
        run: node scripts/validate.mjs
        env:
          MARKETPLACE_ROOT: ${{ github.workspace }}

      - name: Check the index is current
        run: |
          git diff --exit-code -- catalog/index.json || {
            echo "::error::catalog/index.json is stale — run 'npm run build:index' and commit the result"
            exit 1
          }

      - name: Check the bundle carries hooks and is current
        run: |
          git diff --exit-code -- catalog/bundle.json || {
            echo "::error::catalog/bundle.json is stale — run 'npm run build:bundle' and commit the result"
            exit 1
          }
          node -e '
            const b = require("./catalog/bundle.json");
            const withHooks = b.plugins.filter((p) => p.hooks && (p.hooks.deny?.length || p.hooks.notify?.length));
            if (withHooks.length < 10) {
              console.error("::error::only " + withHooks.length + " bundles publish hooks — hooks are being dropped by build:bundle.mjs");
              process.exit(1);
            }
            console.log("bundles with hook rules: " + withHooks.length);
          '
